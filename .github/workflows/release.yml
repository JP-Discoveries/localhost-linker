name: Release

# Runs only on a version tag:
#   git tag -a v0.1.0 -m "Localhost Linker v0.1.0" && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the Release and upload assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Set up Node (for the Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "out/LocalhostLinker-$v-win-x64-setup.exe"
          Compress-Archive -Path "src-tauri/target/release/localhost-linker.exe" -DestinationPath "out/LocalhostLinker-$v-win-x64-portable.zip"
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          (Get-ChildItem out/*).FullName
          --title "Localhost Linker ${{ github.ref_name }}"
          --generate-notes
