name: Release

# Runs only on a version tag:
#   git tag -a v0.1.0 -m "Localhost Linker v0.1.0" && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            args: ''
            rust-targets: ''
          - os: macos-latest
            bundles: dmg
            args: --target universal-apple-darwin   # one download for Apple Silicon and Intel
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04   # oldest supported glibc, so the AppImage runs on more distros
            bundles: appimage,deb,rpm
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file xdg-utils
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Set up Node (for the Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build bundles
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "out/LocalhostLinker-$v-win-x64-setup.exe"
          Compress-Archive -Path "src-tauri/target/release/localhost-linker.exe" -DestinationPath "out/LocalhostLinker-$v-win-x64-portable.zip"
      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          v="${{ github.ref_name }}"
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/LocalhostLinker-$v-macos-universal.dmg"
      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          v="${{ github.ref_name }}"
          b=src-tauri/target/release/bundle
          mkdir -p out
          cp $b/appimage/*.AppImage "out/LocalhostLinker-$v-linux-x86_64.AppImage"
          cp $b/deb/*.deb "out/LocalhostLinker-$v-linux-amd64.deb"
          cp $b/rpm/*.rpm "out/LocalhostLinker-$v-linux-x86_64.rpm"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: out
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" out/*
          --repo "${{ github.repository }}"
          --title "Localhost Linker ${{ github.ref_name }}"
          --generate-notes
